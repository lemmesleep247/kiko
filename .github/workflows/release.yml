name: Build & Release APK

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example: 3.0.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Determine version and tag
      # ------------------------------------------------------------
      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi

          # Validate semantic version: X.Y.Z
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Expected format: 3.0.2"
            exit 1
          fi

          TAG="v${VERSION}"

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

          echo "Version: ${VERSION}"
          echo "Tag: ${TAG}"

      # ------------------------------------------------------------
      # 3. Create and push tag for manual releases
      # ------------------------------------------------------------
      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.TAG }}
        run: |
          # Check whether the tag already exists
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists."

            echo "Checking out existing tag..."
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          else
            echo "Creating tag ${TAG}..."

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      # ------------------------------------------------------------
      # 4. Checkout exact release tag
      # ------------------------------------------------------------
      - name: Checkout release tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.TAG }}
          fetch-depth: 0

      # ------------------------------------------------------------
      # 5. Setup Java 17
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ------------------------------------------------------------
      # 6. Setup Android SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      # ------------------------------------------------------------
      # 7. Create local.properties
      # ------------------------------------------------------------
      - name: Create local.properties
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: |
          echo "MAL_CLIENT_ID=${MAL_CLIENT_ID}" > local.properties

      # ------------------------------------------------------------
      # 8. Prepare Gradle
      # ------------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # ------------------------------------------------------------
      # 9. Build release APK
      # ------------------------------------------------------------
      - name: Build release APK
        run: |
          ./gradlew clean assembleRelease --no-daemon

      # ------------------------------------------------------------
      # 10. Decode release keystore
      # ------------------------------------------------------------
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      # ------------------------------------------------------------
      # 11. Find APK
      # ------------------------------------------------------------
      - name: Locate release APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK found!"
            find app/build/outputs -type f || true
            exit 1
          fi

          echo "Found APK: $APK"
          echo "input=$APK" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 12. Zipalign
      # ------------------------------------------------------------
      - name: Zipalign APK
        run: |
          APK="${{ steps.apk.outputs.input }}"
          ALIGNED="app/build/outputs/apk/release/kiko-release-aligned.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -v -p 4 \
            "$APK" \
            "$ALIGNED"

      # ------------------------------------------------------------
      # 13. Sign APK
      # ------------------------------------------------------------
      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ALIGNED="app/build/outputs/apk/release/kiko-release-aligned.apk"
          SIGNED="app/build/outputs/apk/release/kiko-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

      # ------------------------------------------------------------
      # 14. Verify signature
      # ------------------------------------------------------------
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/kiko-release.apk

      # ------------------------------------------------------------
      # 15. Rename APK
      # ------------------------------------------------------------
      - name: Rename APK
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          mv \
            app/build/outputs/apk/release/kiko-release.apk \
            "app/build/outputs/apk/release/Kiko-${VERSION}.apk"

      # ------------------------------------------------------------
      # 16. Create GitHub Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${{ steps.version.outputs.TAG }}"

          gh release create "$TAG" \
            "app/build/outputs/apk/release/Kiko-${VERSION}.apk" \
            --title "Kiko ${VERSION}" \
            --generate-notes
